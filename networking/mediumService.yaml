apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: practica
  labels:
    app: tienda
    component: frontend

spec:
  type: ClusterIP

  selector:
    app: tienda
    component: frontend

  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: http

  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300