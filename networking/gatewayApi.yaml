apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: entrada-tienda
  namespace: practica
spec:
  gatewayClassName: mi-clase
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same



apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ruta-productos
  namespace: practica
spec:
  parentRefs:
    - name: entrada-tienda
      sectionName: web

  hostnames:
    - tienda.example.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/productos
      backendRefs:
        - name: productos
          port: 80
