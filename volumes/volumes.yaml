
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archivos
  namespace: practica
spec:
  storageClassName: almacenamiento-practica
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: practica
data:
  entorno: "practica"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: practica
type: Opaque
stringData:
  token: "token-ficticio"

---
apiVersion: v1
kind: Pod
metadata:
  name: volumes-demo
  namespace: practica
spec:
  containers:
    - name: laboratorio
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]

      volumeMounts:
        - name: datos
          mountPath: /datos

        - name: temporales
          mountPath: /temporales

        - name: configuracion
          mountPath: /config
          readOnly: true

  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: archivos

    - name: temporales
      emptyDir:
        sizeLimit: 100Mi

    - name: configuracion
      projected:
        sources:
          - configMap:
              name: app-config
              items:
                - key: entorno
                  path: entorno.txt

          - secret:
              name: app-secret
              items:
                - key: token
                  path: token.txt

          - downwardAPI:
              items:
                - path: nombre-pod.txt
                  fieldRef:
                    fieldPath: metadata.name